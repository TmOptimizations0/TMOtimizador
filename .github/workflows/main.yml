name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto
        run: |
          if [ ! -f projeto.zip ]; then
            echo "Falta o arquivo projeto.zip na raiz do repositório"
            exit 1
          fi
          unzip -o -q projeto.zip

      - name: Configurar ícone
        run: |
          set -e
          mkdir -p app/src/main/res/mipmap-nodpi
          if [ -f ic_launcher.png ] && [ -f ic_launcher_foreground.png ]; then
            echo "Usando o ícone enviado"
            mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
            cp ic_launcher.png ic_launcher_foreground.png app/src/main/res/mipmap-nodpi/
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources><color name="ic_launcher_background">#000105</color></resources>' > app/src/main/res/values/ic_colors.xml
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '  <background android:drawable="@color/ic_launcher_background"/>' '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' '</adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          else
            echo "Ícone não encontrado no repositório, usando o ícone padrão"
            cp app/src/main/res/drawable/ic_fallback.xml app/src/main/res/mipmap-nodpi/ic_launcher.xml
          fi

      - name: Configurar assinatura
        run: |
          mkdir -p "$HOME/.android"
          if [ -f debug.keystore ]; then
            cp debug.keystore "$HOME/.android/debug.keystore"
            echo "Usando a chave de assinatura fixa"
          else
            echo "Chave fixa não encontrada, usando chave temporária"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TM-Otimizador-APK
          path: app/build/outputs/apk/debug/*.apk
          
